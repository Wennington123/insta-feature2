<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: "DejaVu Sans", system-ui, sans-serif;
    background: #ffffff; color: #1A2332;
    padding: 96px; display: flex; flex-direction: column; position: relative;
  }
  .corner { position: absolute; width: 72px; height: 72px; }
  .tl { top: 40px; left: 40px;  border-top: 6px solid #0578F5; border-left: 6px solid #0578F5; }
  .tr { top: 40px; right: 40px; border-top: 6px solid #0578F5; border-right: 6px solid #0578F5; }
  .bl { bottom: 40px; left: 40px;  border-bottom: 6px solid #0578F5; border-left: 6px solid #0578F5; }
  .br { bottom: 40px; right: 40px; border-bottom: 6px solid #0578F5; border-right: 6px solid #0578F5; }

  header { display: flex; align-items: center; justify-content: space-between; }
  header img { height: 68px; }
  header .handle { font-size: 30px; font-weight: 700; color: #1A2332; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow {
    font-size: 27px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase; color: #0578F5;
  }
  h1 { font-size: 84px; line-height: 1.1; font-weight: 800; margin: 30px 0 34px; }
  h1 .hl { color: #0578F5; }
  .rule { width: 150px; height: 6px; background: #0578F5; border-radius: 3px; margin-bottom: 38px; }
  p { font-size: 35px; line-height: 1.55; color: #57606a; max-width: 880px; }
  .chip {
    display: inline-flex; align-items: center; gap: 16px; align-self: flex-start;
    background: #25D366; color: #fff; font-size: 31px; font-weight: 700;
    padding: 24px 46px; border-radius: 999px; margin-top: 56px;
  }
  .chip svg { width: 36px; height: 36px; fill: #fff; }

  footer { display: flex; justify-content: space-between; font-size: 25px; color: #8b949e; }
</style>
</head>
<body>
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <header>
    <img src="logo_wtec.png" alt="W-Tec">
    <span class="handle">@w.tec_digital</span>
  </header>

  <main>
    <div class="eyebrow">Assistência técnica • Petrolina</div>
    <h1>Notebook <span class="hl">lento</span><br>não é velhice.</h1>
    <div class="rule"></div>
    <p>Upgrade de SSD + otimização completa: liga em segundos e abre tudo na hora.</p>

</html>
